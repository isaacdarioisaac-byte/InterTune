name: Build InterTune Preview

on:
  push:
    branches:
      - feature/48h-cooldown-artist-2-per-2h
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android NDK license for this build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install required CMake
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.31.6"

      - name: Run radio-limit unit tests
        run: ./gradlew :app:testCoreDebugUnitTest --tests com.dd3boh.outertune.playback.RadioQueueRulesTest

      - name: Build installable preview APK
        run: ./gradlew :app:assembleCorePreview -PpreviewVersion=20261123.${{ github.run_number }}

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*core-preview*.apk' -o -name '*corePreview*.apk' | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='dev.skye.intertune.preview'|^application-label:'InterTune Preview'"
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: InterTune-Preview-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
